name: resihub-prod
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
      DB_PATH: /app/server/data/resihub.db
      PORT: 8080
      GATEWAY_PORT: 3128
      PUBLIC_GATEWAY_PORT: ${GATEWAY_EXTERNAL_PORT:-3128}
      PUBLIC_BASE_URL: https://${DOMAIN:?Set DOMAIN in deploy/.env.production}
      PAY_RETURN_BASE_URL: https://${DOMAIN:?Set DOMAIN in deploy/.env.production}
      PUBLIC_GATEWAY_HOST: ${GATEWAY_HOST:-${DOMAIN}}
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_EXTERNAL_PORT:-3128}:3128"
    volumes:
      - database:/app/server/data
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  database:
  caddy_data:
  caddy_config:
